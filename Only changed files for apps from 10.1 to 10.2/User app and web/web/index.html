<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=Edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <title>eFood | Premium Food Ordering & Delivery</title>
  <meta name="description" content="A comprehensive, enterprise-grade web application for seamless food ordering and rapid delivery.">
  
  <base href="/">

  <!-- Security & Authentication Integrations -->
  <meta name="google-signin-client_id" content="YOUR_GOOGLE_SIGN_IN_CLIENT_KEY">
  <style>.grecaptcha-badge { visibility: hidden !important; }</style>

  <!-- iOS PWA Capabilities & Mobile Optimizations -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="eFood">
  
  <!-- Branding Assets & Preloading Performance Layouts -->
  <link rel="apple-touch-icon" href="favicon.png">
  <link rel="shortcut icon" type="image/png" href="favicon.png">
  <link rel="manifest" href="manifest.json">
  
  <!-- Critical Resource Hinting -->
  <link rel="preload" href="assets/logo.png" as="image">
  <link rel="preload" href="assets/header_icon_1.png" as="image">
  <link rel="preload" href="assets/header_icon_2.png" as="image">
  
  <!-- Application Stylesheets -->
  <link rel="stylesheet" type="text/css" href="style.css">

  <style>
    /* Critical Preloader Performance Layout Styles */
    .preloader {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 99999;
      transition: opacity 0.4s ease-out, visibility 0.4s;
    }
    .preloader.fade-out {
      opacity: 0;
      visibility: hidden;
    }
    .animation-image {
      display: none;
    }
    .animation-image:first-child {
      display: block;
    }
    /* Theme State Initialization Management */
    body.theme-dark {
      background-color: #121212;
      color: #ffffff;
    }
    body.theme-light {
      background-color: #ffffff;
      color: #333333;
    }
  </style>

  <!-- Firebase JavaScript Core & Analytics SDKs -->
  <script defer src="https://gstatic.com"></script>
  <script defer src="https://gstatic.com"></script>

  <!-- Google Maps Platform Integration API -->
  <script async defer src="https://googleapis.com"></script>
</head>
<body>

  <!-- Enterprise Application Theme Orchestrator -->
  <script>
    (function () {
      try {
        if (typeof Storage !== "undefined") {
          var savedTheme = localStorage.getItem("flutter.theme");
          if (savedTheme === "true") {
            document.body.classList.add("theme-dark");
          } else {
            document.body.classList.add("theme-light");
          }
        }
      } catch (e) {
        console.warn("Theme initialisation runtime context unavailable:", e);
      }
    })();
  </script>

  <!-- Optimized Main Application Loading Ecosystem -->
  <div id="app-preloader" class="preloader" aria-hidden="true">
    <div class="preloader-container">
      <div id="animation-container">
        <img width="80" height="80" src="assets/loader_image_1.png" class="animation-image" alt="Loading asset step 1">
        <img width="80" height="80" src="assets/loader_image_2.png" class="animation-image" alt="Loading asset step 2">
        <img width="80" height="80" src="assets/loader_image_3.png" class="animation-image" alt="Loading asset step 3">
        <img width="80" height="80" src="assets/loader_image_4.png" class="animation-image" alt="Loading asset step 4">
        <img width="80" height="80" src="assets/loader_image_5.png" class="animation-image" alt="Loading asset step 5">
      </div>
      <div class="loader" role="progressbar" aria-busy="true"></div>
    </div>
  </div>

  <!-- Global Navigational Header Layout Structure -->
  <header class="header">
    <div class="header-top-line"></div>
    <div class="header-container d-flex align-items-center justify-content-between">
      <div class="header-start d-flex gap-5 align-items-center">
        <img class="logo" src="assets/logo.png" width="120" height="40" loading="eager" alt="eFood Enterprise Platform Logo">
        <div class="placeholder placeholder-wide"></div>
        <nav class="d-flex align-items-center gap-4" aria-label="Primary Platform Navigation">
          <div class="placeholder"></div>
          <div class="placeholder"></div>
          <div class="placeholder"></div>
          <div class="placeholder"></div>
        </nav>
      </div>
      <div class="header-end d-flex align-items-center gap-5">
        <div class="placeholder"></div>
        <div class="d-flex align-items-center gap-4">
          <div class="placeholder"></div>
          <img src="assets/header_icon_1.png" width="16" height="16" class="header-icon" loading="eager" alt="Navigation Notification Utility">
          <img src="assets/header_icon_2.png" width="16" height="16" class="header-icon" loading="eager" alt="Navigation User Profile Utility">
        </div>
      </div>
    </div>
  </header>

  <!-- Core Client Infrastructure & Script Automation Engine -->
  <script>
    window.onMapsLibraryLoaded = function() {
      console.log("Google Maps Engine context instantiated successfully.");
    };

    document.addEventListener("DOMContentLoaded", function () {
      // Setup Frame Animation Sequences for Active Preloader
      var preloaderImages = document.querySelectorAll(".animation-image");
      var currentFrameIndex = 0;
      var fallbackFrameInterval = null;

      if (preloaderImages.length > 0) {
        fallbackFrameInterval = setInterval(function cycleImages() {
          preloaderImages[currentFrameIndex].style.display = "none";
          currentFrameIndex = (currentFrameIndex + 1) % preloaderImages.length;
          preloaderImages[currentFrameIndex].style.display = "block";
        }, 250);
      }

      // Initialize Firebase via Client Configuration Schema securely
      function initializeCloudServices() {
        if (typeof firebase !== 'undefined') {
          var firebaseConfig = {
            apiKey: "AIzaSyAMLk1-dj8g0qCqU3DkxLKHbrT0VhK5EeQ",
            authDomain: "e-food-9e6e3.firebaseapp.com",
            projectId: "e-food-9e6e3",
            storageBucket: "e-food-9e6e3.appspot.com",
            messagingSenderId: "410522356318",
            appId: "1:410522356318:web:1f962a90aabeb82a3dc2cf",
            measurementId: "G-X1LHXV0DK1"
          };
          
          firebase.initializeApp(firebaseConfig);
          if ("measurementId" in firebaseConfig) {
            firebase.analytics();
          }
          console.log("Firebase Platform Gateway initialised successfully.");
        } else {
          // Retry logic if scripts load slowly over high-latency links
          setTimeout(initializeCloudServices, 100);
        }
      }

      initializeCloudServices();

      // Monitor main core application bundle lifecycle to dismiss loader cleanly
      window.addEventListener('load', function() {
        var preloaderElement = document.getElementById("app-preloader");
        if (preloaderElement) {
          preloaderElement.classList.add("fade-out");
          setTimeout(function() {
            preloaderElement.remove();
            if (fallbackFrameInterval) clearInterval(fallbackFrameInterval);
          }, 400);
        }
      });
    });
  </script>

  <!-- Primary Built Compiled Flutter Web Module Injection Entry -->
  <script src="main.dart.js?version=10.2" defer type="application/javascript"></script>
</body>
</html>
